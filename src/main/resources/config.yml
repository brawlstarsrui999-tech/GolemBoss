# ═══════════════════════════════════════════════════════════════
#   ГОЛЕМ РАЗРУШИТЕЛЬ — настройки босса
#   Стиль: пурпурный ✦
# ═══════════════════════════════════════════════════════════════

golem:
  # Общее количество здоровья босса (обе фазы суммарно)
  max-hp: 1500.0
  # Урон босса (чистый, игнорирует броню)
  damage: 15.0

  # Размер голема. 1.35 = больше обычного голема примерно на 1 блок
  phase1-scale: 1.35
  # Размер во 2 фазе. 2.0 = ещё на 2 блока больше
  phase2-scale: 2.0

  # Базовая скорость движения голема
  phase1-speed: 0.25
  # Множитель замедления во 2 фазе (меньше = медленнее)
  phase2-slowdown: 0.7
  # Множитель скорости ударов во 2 фазе
  phase2-attack-slowdown: 0.55

  # Имя босса (MiniMessage-формат)
  boss-name: "<gradient:#7c3aed:#d8b4fe><b>✦ ГОЛЕМ РАЗРУШИТЕЛЬ ✦</b></gradient>"

  # Радиус показа босс-бара (блоки)
  bossbar-radius: 300

minions:
  # Сколько приспешников спавнится при атаке (и во 2 фазе)
  count: 5
  # Здоровье одного големчика
  hp: 60.0
  # Урон големчика (чистый)
  damage: 10.0
  # Размер големчика (0.7 = примерно 2 блока в высоту)
  scale: 0.7
  # Скорость — чуть быстрее обычного голема (обычный ~0.25)
  speed: 0.33
  # Радиус, в котором големчик ищет цель
  aggro-radius: 16.0
  # Имя големчика
  minion-name: "<color:#a78bfa><b>⚠ Големчик-страж</b></color>"

loot:
  # Сколько стаков железа выпадает за весь бой (рандом между min и max)
  ingot-stacks-min: 5
  ingot-stacks-max: 7
  # Сколько слитков падает за один удар (рандом между min и max)
  ingot-per-hit-min: 1
  ingot-per-hit-max: 4

timing:
  # Через сколько минут появится босс после команды
  countdown-minutes: 15

phases:
  # На каком проценте ХП начинается 2 фаза (0.5 = половина)
  phase2-trigger: 0.5
