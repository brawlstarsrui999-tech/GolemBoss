name: GolemBoss
version: 1.0.0
main: dev.arena.golemboss.GolemBossPlugin
api-version: 1.21
description: Boss plugin - Golem Destroyer with 2 phases, minions and rewards.
author: Ruin4ik

commands:
  event:
    description: Главная команда босса «Голем Разрушитель»
    usage: |
      /event golem <x> <y> <z>   - призвать босса через 15 минут
      /event golem               - призвать на свои координаты
      /event golem cancel        - отменить призыв
      /event golem info          - статус босса
    permission: golemboss.admin
    aliases: [golem, boss]

permissions:
  golemboss.admin:
    description: Позволяет использовать команды босса
    default: op
